spring:
  application:
    name: pawconnect
  datasource:
    url: ${DB_URL:jdbc:h2:mem:pawconnect;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
  h2:
    console:
      enabled: false
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:10000}
      mail.smtp.timeout: ${SMTP_TIMEOUT_MS:20000}
      mail.smtp.writetimeout: ${SMTP_WRITE_TIMEOUT_MS:20000}

app:
  jwt:
    # Must be supplied by environment outside the local development default.
    secret: ${JWT_SECRET:replace-this-development-only-secret-with-at-least-32-characters}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P14D}
  auth:
    otp-ttl: ${AUTH_OTP_TTL:PT5M}
    otp-resend-cooldown: ${AUTH_OTP_RESEND_COOLDOWN:PT60S}
    reset-token-ttl: ${AUTH_RESET_TOKEN_TTL:PT10M}
  mail:
    from: ${SMTP_FROM:${SMTP_USERNAME:}}
    from-name: ${SMTP_FROM_NAME:PawConnect}
  websocket:
    allowed-origin-pattern: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERN:http://localhost:*}
  cloudinary:
    enabled: ${CLOUDINARY_ENABLED:false}
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    max-file-size-bytes: ${CLOUDINARY_MAX_FILE_SIZE_BYTES:5242880}
    max-image-dimension: ${CLOUDINARY_MAX_IMAGE_DIMENSION:4096}
  seed:
    users:
      enabled: ${SEED_USERS_ENABLED:false}
      directory: ${SEED_V3_DIRECTORY:data-pipeline/data/seed/v3}
      password: ${SEED_USER_PASSWORD:}
