<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <!-- Shared Header Fragment -->
    <header th:fragment="header" class="main-header">
        <style>
/* --- NOTIFICATION BELL & DROPDOWN --- */
.notification-wrapper {
    position: relative !important;
    display: inline-flex !important;
    align-items: center !important;
}

.notification-btn {
    position: relative !important;
    width: 2.7rem !important;
    height: 2.7rem !important;
    border-radius: 50% !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    background: transparent !important;
    border: none !important;
    font-size: 1.15rem !important;
    color: var(--text-main, #2d3748) !important;
    cursor: pointer !important;
    transition: background-color 0.2s ease, color 0.2s ease !important;
}

.notification-btn:hover,
.notification-btn:focus-visible {
    background: rgba(226, 123, 88, 0.12) !important;
    color: var(--primary-color, #e27b58) !important;
    outline: none !important;
}

.notification-badge {
    position: absolute !important;
    top: -2px !important;
    right: -2px !important;
    background: #e53e3e !important;
    color: #ffffff !important;
    font-size: 0.7rem !important;
    font-weight: 800 !important;
    min-width: 18px !important;
    height: 18px !important;
    line-height: 18px !important;
    border-radius: 9999px !important;
    text-align: center !important;
    padding: 0 4px !important;
    border: 2px solid #ffffff !important;
    box-shadow: 0 2px 6px rgba(229, 62, 62, 0.4) !important;
    pointer-events: none !important;
    box-sizing: content-box !important;
}

.notification-dropdown {
    position: absolute !important;
    top: calc(100% + 12px) !important;
    right: 0 !important;
    width: 380px !important;
    max-width: min(380px, 92vw) !important;
    background: #ffffff !important;
    border: 1px solid #e2e8f0 !important;
    border-radius: 16px !important;
    box-shadow: 0 16px 45px rgba(0, 0, 0, 0.16) !important;
    z-index: 999999 !important;
    overflow-x: hidden !important;
    overflow-y: hidden !important;
    box-sizing: border-box !important;
    text-align: left !important;
    white-space: normal !important;
    animation: notificationFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) !important;
}

.notification-dropdown * {
    box-sizing: border-box !important;
}

.notification-dropdown[hidden] {
    display: none !important;
}

@keyframes notificationFadeIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
}

.notification-dropdown-header {
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    padding: 0.85rem 1.15rem !important;
    background: #faf7f5 !important;
    border-bottom: 1px solid #ebdcd3 !important;
    white-space: normal !important;
}

.notification-dropdown-title,
.notification-title {
    font-size: 0.95rem !important;
    font-weight: 800 !important;
    color: var(--text-main, #2d3748) !important;
    display: inline-flex !important;
    align-items: center !important;
    gap: 0.5rem !important;
    margin: 0 !important;
    white-space: nowrap !important;
}

.notification-dropdown-title i,
.notification-title i {
    color: var(--primary-color, #e27b58) !important;
}

.notification-mark-all {
    background: transparent !important;
    border: 0 !important;
    color: var(--primary-color, #e27b58) !important;
    font-size: 0.82rem !important;
    font-weight: 700 !important;
    cursor: pointer !important;
    padding: 0.25rem 0.5rem !important;
    border-radius: 6px !important;
    transition: background 0.15s ease !important;
    white-space: nowrap !important;
}

.notification-mark-all:hover {
    background: rgba(226, 123, 88, 0.12) !important;
}

.notification-list {
    max-height: 380px !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    padding: 0 !important;
    margin: 0 !important;
    white-space: normal !important;
}

.notification-item {
    display: flex !important;
    align-items: flex-start !important;
    gap: 0.85rem !important;
    padding: 0.85rem 1.15rem !important;
    border-bottom: 1px solid #f1f5f9 !important;
    cursor: pointer !important;
    transition: background 0.15s ease !important;
    position: relative !important;
    background: #ffffff !important;
    text-decoration: none !important;
    width: 100% !important;
    white-space: normal !important;
    box-sizing: border-box !important;
}

.notification-item:hover {
    background: #f8fafc !important;
}

.notification-item.unread {
    background: #fff8f5 !important;
}

.notification-item.unread::before {
    content: '' !important;
    position: absolute !important;
    left: 6px !important;
    top: 50% !important;
    transform: translateY(-50%) !important;
    width: 6px !important;
    height: 6px !important;
    border-radius: 50% !important;
    background: var(--primary-color, #e27b58) !important;
}

.notification-item-icon {
    flex: 0 0 34px !important;
    width: 34px !important;
    height: 34px !important;
    border-radius: 50% !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    font-size: 0.95rem !important;
    margin-top: 2px !important;
    flex-shrink: 0 !important;
}

.notification-item-icon.approved {
    background: rgba(16, 185, 129, 0.12) !important;
    color: #10b981 !important;
}

.notification-item-icon.rejected {
    background: rgba(239, 68, 68, 0.12) !important;
    color: #ef4444 !important;
}

.notification-item-icon.default,
.notification-item-icon.info {
    background: rgba(226, 123, 88, 0.12) !important;
    color: var(--primary-color, #e27b58) !important;
}

.notification-item-content,
.notification-item-body {
    flex: 1 1 0% !important;
    min-width: 0 !important;
    max-width: 100% !important;
    white-space: normal !important;
    overflow-wrap: break-word !important;
    word-break: break-word !important;
}

.notification-item-title {
    font-size: 0.88rem !important;
    font-weight: 700 !important;
    color: var(--text-main, #2d3748) !important;
    margin: 0 0 0.25rem 0 !important;
    line-height: 1.35 !important;
    white-space: normal !important;
    overflow-wrap: break-word !important;
    word-break: break-word !important;
}

.notification-item-desc {
    font-size: 0.82rem !important;
    color: var(--text-muted, #64748b) !important;
    margin: 0 0 0.35rem 0 !important;
    line-height: 1.45 !important;
    white-space: normal !important;
    overflow-wrap: break-word !important;
    word-break: break-word !important;
}

.notification-item-time {
    font-size: 0.75rem !important;
    color: #94a3b8 !important;
    font-weight: 600 !important;
    display: block !important;
    white-space: normal !important;
    margin-top: 2px !important;
}

.notification-unread-dot {
    width: 8px !important;
    height: 8px !important;
    border-radius: 50% !important;
    background: #e53e3e !important;
    flex-shrink: 0 !important;
    margin-top: 6px !important;
}

.notification-empty {
    padding: 2.5rem 1.5rem !important;
    text-align: center !important;
    color: var(--text-muted, #718096) !important;
    font-size: 0.9rem !important;
    margin: 0 !important;
    white-space: normal !important;
}

        </style>
        <div class="container">
            <div class="brand-cluster">
                <button id="management-menu-toggle" class="management-menu-toggle" type="button" aria-controls="management-sidebar" aria-expanded="false" title="Mở menu quản lý" hidden>
                    <i class="fas fa-bars"></i>
                    <span class="sr-only">Mở menu quản lý</span>
                </button>
                <a href="/shop" class="logo">
                    <i class="fas fa-paw"></i> PawConnect
                </a>
            </div>
            
            <nav class="nav-menu-wrapper" aria-label="Điều hướng chính">
                <ul class="nav-menu">
                    <li><a href="/shop">Cửa hàng</a></li>
                    <li><a href="/service">Dịch vụ</a></li>
                    <li><a href="/adoptions">Nhận nuôi</a></li>
                <li><a href="/orders" data-customer-only hidden>Đơn của tôi</a></li>
                </ul>
            </nav>

            <div class="header-actions">
                <button class="icon-btn" id="headerSearchBtn" type="button" title="Tìm kiếm" aria-label="Tìm kiếm">
                    <i class="fas fa-search"></i>
                </button>
                <button class="icon-btn" id="cartBtn" type="button" title="Giỏ hàng" aria-label="Mở giỏ hàng">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-badge" id="cartCount">0</span>
                </button>
                <div class="notification-wrapper" id="notificationWrapper" hidden>
                    <button class="icon-btn notification-btn" id="notificationBtn" type="button" title="Thông báo" aria-label="Xem thông báo" aria-expanded="false">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge" id="notificationBadge" style="display: none;">0</span>
                    </button>
                    <div class="notification-dropdown" id="notificationDropdown" hidden>
                        <div class="notification-dropdown-header">
                            <span class="notification-dropdown-title"><i class="fas fa-bell"></i> Thông báo</span>
                            <button class="notification-mark-all" id="markAllReadBtn" type="button">Đã đọc tất cả</button>
                        </div>
                        <div class="notification-list" id="notificationList">
                            <div class="notification-empty">Đang tải thông báo...</div>
                        </div>
                    </div>
                </div>
                <a href="/service" class="btn-pill" data-booking-access>Đặt lịch ngay</a>
                <a class="user-pill account-profile-link" id="account-summary" href="/profile" title="Mở hồ sơ tài khoản" hidden>
                    <i id="account-icon" class="fas fa-user-circle"></i>
                    <img id="account-avatar" class="header-avatar" alt="Ảnh đại diện" hidden>
                    <span id="account-status" class="account-status">Khách</span>
                </a>
                <button class="btn-pill btn-outline header-auth-action" id="auth-action" type="button">Đăng nhập</button>
            </div>
        </div>
        <div id="management-sidebar-backdrop" class="management-sidebar-backdrop" hidden></div>
        <aside id="management-sidebar" class="management-sidebar" aria-label="Menu quản lý" hidden>
            <div class="management-sidebar-header">
                <div>
                    <p>PAWCONNECT</p>
                    <h2>Quản lý</h2>
                </div>
                <button id="management-menu-close" class="management-menu-close" type="button" title="Đóng menu quản lý" aria-label="Đóng menu quản lý">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <nav class="management-sidebar-links" aria-label="Chức năng quản lý">
                <a href="/admin/products" data-staff-only hidden><i class="fas fa-store"></i> Quản lý Cửa hàng</a>
                <a href="/adoptions/manage" data-staff-only hidden><i class="fas fa-paw"></i> Quản lý Nhận nuôi</a>
                <a href="/admin/orders" data-staff-only hidden><i class="fas fa-receipt"></i> Quản lý đơn hàng</a>
                <a href="/admin/services" data-staff-only hidden><i class="fas fa-calendar-check"></i> Quản lý Dịch vụ</a>
                <a href="/admin/users" data-admin-only hidden><i class="fas fa-users-gear"></i> Quản lý tài khoản</a>
                <a href="/admin/branches" data-admin-only hidden><i class="fas fa-location-dot"></i> Quản lý chi nhánh</a>
            </nav>
            <div class="management-sidebar-visual" aria-hidden="true">
            </div>
        </aside>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="/css/header.css?v=20261026-5">
        <link rel="stylesheet" href="/css/chat-widget.css?v=20261017-8">
        <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js" defer></script>
        <script src="/js/header.js?v=20261028-notifs-1" defer></script>
        <script src="/js/chat-widget.js?v=20261017-7" defer></script>
    </header>
</body>
</html>
