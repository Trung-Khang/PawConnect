<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:replace="~{fragments/bootstrap :: assets}"></th:block>
    <title>Biên lai đơn hàng | PawConnect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/shop.css">
    <link rel="stylesheet" href="/css/header.css?v=20261026-5">
    <link rel="stylesheet" href="/css/commerce.css?v=20261026-2">
</head>
<body class="commerce-screen">
<div th:replace="~{fragments/header :: header}"></div>
<main class="commerce-page container py-4 py-md-5">
    <div class="receipt-actions">
        <a href="/orders" class="commerce-back">← Đơn của tôi</a>
        <button id="print-receipt" class="btn-pill" type="button" hidden>In biên lai</button>
    </div>
    <p id="receipt-notice" class="commerce-notice" role="status" hidden></p>
    <article id="receipt" class="commerce-panel receipt" hidden>
        <header class="receipt-heading">
            <div><p class="receipt-brand">PawConnect</p><h1 id="receipt-heading-title">Thông tin đơn hàng</h1></div>
            <div><strong id="receipt-number"></strong><span id="receipt-time"></span></div>
        </header>
        <div class="row g-4 receipt-details">
            <div class="col-12 col-md-6"><h2>Khách hàng</h2><p id="receipt-customer"></p><p id="receipt-recipient"></p><p id="receipt-phone"></p><p id="receipt-delivery-address"></p></div>
            <div class="col-12 col-md-6"><h2>Chi nhánh bán</h2><p id="receipt-branch"></p><p id="receipt-branch-address"></p><p id="receipt-branch-phone"></p><h2 class="mt-3">Thanh toán</h2><p id="receipt-payment-method"></p><p id="receipt-payment-status"></p><p id="receipt-customer-confirmed" hidden></p><p id="receipt-seller-confirmed" hidden></p><p id="receipt-order-status"></p></div>
        </div>
        <div class="table-responsive">
            <table class="table receipt-table"><thead><tr><th>Sản phẩm</th><th class="text-end">SL</th><th class="text-end">Đơn giá</th><th class="text-end">Thành tiền</th></tr></thead><tbody id="receipt-items"></tbody></table>
        </div>
        <p class="commerce-total receipt-total"><span>Tổng thanh toán</span><strong id="receipt-total"></strong></p>
    </article>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="/js/receipt.js?v=20261027-1" defer></script>
</body>
</html>
