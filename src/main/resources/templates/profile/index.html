<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ tài khoản | PawConnect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/shop.css">
    <link rel="stylesheet" href="/css/header.css?v=20261016-2">
    <link rel="stylesheet" href="/css/profile.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="profile-page">
    <section class="profile-shell" aria-labelledby="profile-title">
        <div class="profile-intro">
            <p class="profile-eyebrow">TAI KHOAN PAWCONNECT</p>
            <h1 id="profile-title">Hồ sơ của bạn</h1>
            <p>Cập nhật thông tin liên hệ và ảnh đại diện của tài khoản.</p>
        </div>
        <div id="profile-message" class="profile-message" role="status" hidden></div>
        <div class="profile-grid">
            <section class="avatar-panel" aria-labelledby="avatar-title">
                <h2 id="avatar-title">Ảnh đại diện</h2>
                <div class="avatar-preview" id="avatar-preview" aria-label="Ảnh đại diện hiện tại"><i class="fas fa-user"></i></div>
                <input id="avatar-file" type="file" accept="image/jpeg,image/png,image/gif" hidden>
                <button id="choose-avatar" class="btn-pill" type="button"><i class="fas fa-camera"></i> Chọn ảnh</button>
                <p class="avatar-help">Chấp nhận JPG, PNG hoặc GIF, tối đa 5 MB.</p>
            </section>
            <section class="profile-form-panel" aria-labelledby="details-title">
                <h2 id="details-title">Thông tin cá nhân</h2>
                <form id="profile-form" class="profile-form" novalidate>
                    <label>Họ và tên<input id="profile-full-name" name="fullName" maxlength="120" required autocomplete="name"></label>
                    <label>Số điện thoại<input id="profile-phone" name="phone" maxlength="30" required inputmode="tel" autocomplete="tel" placeholder="0912345678 hoặc +84912345678"></label>
                    <p class="phone-help">Số Việt Nam gồm 10 số, bắt đầu bằng 03, 05, 07, 08 hoặc 09.</p>
                    <div class="profile-readonly"><span>Email</span><strong id="profile-email">-</strong><span>Tên đăng nhập</span><strong id="profile-username">-</strong></div>
                    <button class="btn-pill" type="submit"><i class="fas fa-floppy-disk"></i> Lưu thay đổi</button>
                </form>
            </section>
        </div>
    </section>
</main>
<script src="/js/profile.js" defer></script>
</body>
</html>
