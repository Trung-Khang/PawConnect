<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="~{fragments/bootstrap :: assets}"></th:block>
    <title>Quản lý Lịch hẹn Dịch vụ | PawConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/shop.css">
    <link rel="stylesheet" href="/css/header.css?v=20261021-1">
    <link rel="stylesheet" href="/css/admin-orders.css">
    <style>
        .service-action-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            margin: 0.25rem 0.25rem 0.25rem 0;
            padding: 0.45rem 0.85rem;
            border-radius: 6px;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .btn-confirm { background: #e8f5e9; color: #2e7d32; border-color: #a5d6a7; }
        .btn-confirm:hover { background: #c8e6c9; }
        .btn-arrive { background: #e3f2fd; color: #1565c0; border-color: #90caf9; }
        .btn-arrive:hover { background: #bbdefb; }
        .btn-complete { background: #e0f2f1; color: #00695c; border-color: #80cbc4; }
        .btn-complete:hover { background: #b2dfdb; }
        .btn-noshow { background: #fff3e0; color: #e65100; border-color: #ffcc80; }
        .btn-noshow:hover { background: #ffe0b2; }
        .btn-reject { background: #ffebee; color: #c62828; border-color: #ef9a9a; }
        .btn-reject:hover { background: #ffcdd2; }

        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            font-size: 0.84rem;
            font-weight: 700;
            white-space: nowrap;
            letter-spacing: 0.02em;
        }
        .status-badge.PENDING { background: #fff8e1; color: #f57f17; }
        .status-badge.CONFIRMED { background: #e8f5e9; color: #2e7d32; }
        .status-badge.ARRIVED { background: #e3f2fd; color: #1565c0; }
        .status-badge.COMPLETED { background: #e0f2f1; color: #00695c; }
        .status-badge.NO_SHOW { background: #eceff1; color: #455a64; }
        .status-badge.CANCELLED { background: #ffebee; color: #c62828; }

        .reason-box {
            font-size: 0.82rem;
            color: #c62828;
            margin-top: 0.4rem;
            background: #fff8f8;
            padding: 0.35rem 0.6rem;
            border-radius: 6px;
            border-left: 3px solid #ef5350;
            word-break: break-word;
            max-width: 180px;
        }

        .data-table th:nth-child(7),
        .data-table td:nth-child(7) {
            min-width: 150px;
            white-space: nowrap;
            vertical-align: middle;
        }
        .data-table th:nth-child(8),
        .data-table td:nth-child(8) {
            min-width: 180px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="admin-orders-page">
    <a class="admin-brand" href="/shop">PawConnect</a>
    <header class="top-header" style="flex-wrap: wrap; gap: 1rem; align-items: flex-end;">
        <div>
            <p class="orders-kicker">Vận hành dịch vụ & chăm sóc thú cưng</p>
            <h1>Quản lý Lịch hẹn Dịch vụ</h1>
            <p class="orders-subtitle">Theo dõi, xác nhận và cập nhật trạng thái lịch hẹn của khách hàng.</p>
        </div>
        <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center;">
            <select id="branch-filter" class="form-control" style="width: auto; min-width: 160px; font-size: 0.9rem;" hidden>
                <option value="">Tất cả chi nhánh</option>
            </select>
            <select id="status-filter" class="form-control" style="width: auto; min-width: 150px; font-size: 0.9rem;">
                <option value="">Tất cả trạng thái</option>
                <option value="PENDING">Chờ xác nhận</option>
                <option value="CONFIRMED">Đã xác nhận</option>
                <option value="ARRIVED">Khách đã tới</option>
                <option value="COMPLETED">Đã hoàn thành</option>
                <option value="NO_SHOW">Khách không tới</option>
                <option value="CANCELLED">Đã từ chối / Đã hủy</option>
            </select>
            <button id="reload-services" class="btn btn-secondary" type="button"><i class="fas fa-rotate"></i> Tải lại</button>
        </div>
    </header>
    <p id="services-notice" class="orders-notice" hidden></p>
    <section class="table-container table-responsive">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Mã lịch</th>
                    <th>Khách hàng</th>
                    <th>Dịch vụ</th>
                    <th>Chi nhánh</th>
                    <th>Ngày & Giờ hẹn</th>
                    <th>Thời điểm đặt</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="services-table-body"></tbody>
        </table>
    </section>
</main>
<script src="/js/admin-services.js?v=20261026-status-fit"></script>
</body>
</html>
