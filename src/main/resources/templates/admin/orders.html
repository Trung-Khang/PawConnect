<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="~{fragments/bootstrap :: assets}"></th:block>
    <title>Quản lý đơn hàng | PawConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/shop.css">
    <link rel="stylesheet" href="/css/header.css?v=20261026-5">
    <link rel="stylesheet" href="/css/admin-orders.css?v=20261026-2">
    <link rel="stylesheet" href="/css/order-progress.css?v=20261026-2">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="admin-orders-page">
    <a class="admin-brand" href="/shop">PawConnect</a>
    <header class="top-header">
        <div>
            <p class="orders-kicker">Vận hành cửa hàng</p>
            <h1>Quản lý đơn hàng</h1>
            <p class="orders-subtitle">Chi nhánh xác nhận thanh toán và nhận xử lý trong một bước. Yêu cầu hủy của khách phải được trả lời trước khi bàn giao vận chuyển.</p>
        </div>
        <button id="reload-orders" class="btn btn-secondary" type="button">Tải lại</button>
    </header>
    <p id="orders-notice" class="orders-notice" role="status" hidden></p>
    <section id="managed-orders" class="orders-card-list" aria-label="Danh sách đơn hàng" aria-live="polite">Đang tải đơn hàng…</section>
</main>
<dialog id="order-action-dialog" class="order-action-dialog" aria-labelledby="order-action-title">
    <form id="order-action-form" class="p-3 p-sm-4">
        <h2 id="order-action-title" class="h5 mb-2"></h2>
        <p id="order-action-description" class="mb-3"></p>
        <label for="order-action-reason" class="form-label">Ghi chú cho khách hàng <span id="order-reason-required" hidden>(bắt buộc)</span></label>
        <textarea id="order-action-reason" class="form-control" rows="3" maxlength="500" placeholder="Ghi chú sẽ hiển thị trong lịch sử đơn hàng"></textarea>
        <div class="d-flex flex-column-reverse flex-sm-row justify-content-end gap-2 mt-4">
            <button id="order-action-back" type="button" class="btn btn-outline-secondary">Quay lại</button>
            <button id="order-action-submit" type="submit" class="btn btn-primary">Xác nhận</button>
        </div>
    </form>
</dialog>
<script src="/js/order-progress.js?v=20261027-1" defer></script>
<script src="/js/admin-orders.js?v=20261027-1" defer></script>
</body>
</html>
