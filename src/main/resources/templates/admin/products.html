<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawConnect - Admin Products</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>PawConnect</h2>
                <span class="badge">Admin</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/admin/products" class="active">Product Management</a>
                <!-- Future links can be added here -->
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="btn btn-secondary btn-full">Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h1>Products & Breeding Dogs</h1>
                <button id="addProductBtn" class="btn btn-primary">+ Add New</button>
            </header>

            <section class="content-section">
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody">
                            <!-- Products will be injected here via JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Add Product Modal -->
    <div id="addProductModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Product / Dog</h2>
                <button class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="addProductForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" id="p_name" required>
                        </div>
                        <div class="form-group">
                            <label>Branch</label>
                            <select id="p_branchId" required></select>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Category</label>
                            <select id="p_categoryId" required></select>
                        </div>
                        <div class="form-group">
                            <label>Product Type (Loại mặt hàng)</label>
                            <select id="p_productType">
                                <option value="dog">Chó giống (Dog)</option>
                                <option value="food">Thức ăn (Food)</option>
                                <option value="other">Khác (Others)</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Price (VND)</label>
                            <input type="number" id="p_price" required min="0">
                        </div>
                        <div class="form-group">
                            <label>Stock</label>
                            <input type="number" id="p_stock" required min="0">
                        </div>
                    </div>

                    <!-- Dog Fields -->
                    <div class="form-row dog-fields dynamic-fields">
                        <div class="form-group">
                            <label>Breed (Giống)</label>
                            <input type="text" id="p_breed">
                        </div>
                        <div class="form-group">
                            <label>Age (Tuổi)</label>
                            <input type="text" id="p_age">
                        </div>
                    </div>
                    <div class="form-row dog-fields dynamic-fields">
                        <div class="form-group">
                            <label>Health Status (Sức khỏe)</label>
                            <input type="text" id="p_healthStatus">
                        </div>
                        <div class="form-group">
                            <label>Care Instructions (Chăm sóc)</label>
                            <input type="text" id="p_careInstructions">
                        </div>
                    </div>

                    <!-- Food Fields -->
                    <div class="form-row food-fields dynamic-fields" style="display: none;">
                        <div class="form-group">
                            <label>Ingredients (Thành phần)</label>
                            <input type="text" id="p_ingredients">
                        </div>
                        <div class="form-group">
                            <label>Target Audience (Đối tượng)</label>
                            <input type="text" id="p_targetAudience">
                        </div>
                    </div>

                    <div class="form-group">
                        <label id="lbl_description">Special Notes (Lưu ý đặc biệt)</label>
                        <textarea id="p_description" rows="3"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Image Upload (Cloudinary)</label>
                        <input type="file" id="p_imageFile" accept="image/*" required>
                        <div id="uploadStatus" class="upload-status"></div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary close-btn">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="saveProductBtn">Save Product</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/admin-products.js"></script>
</body>
</html>
